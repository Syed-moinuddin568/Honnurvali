name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege needed for the Pages deployment to mint its OIDC token.
permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once, but let a queued one finish rather than
# cancelling it — a half-applied Pages deploy is worse than a slow one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        # enablement:true turns Pages on for the repo on the first run, so no
        # manual visit to Settings > Pages is required.
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          # the site root is html/, not the repository root
          path: ./html

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
